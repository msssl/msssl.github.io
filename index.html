<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Research project pages by Shilin Ma." />
    <title>Shilin Ma · Research Projects</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #172033;
        background: #f6f8fb;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px 20px;
      }

      main {
        width: min(720px, 100%);
        padding: clamp(32px, 6vw, 58px);
        background: #fff;
        border: 1px solid #e2e7ef;
        border-radius: 18px;
        box-shadow: 0 18px 55px rgba(27, 40, 68, 0.08);
      }

      .eyebrow {
        margin: 0 0 14px;
        color: #6b7280;
        font-size: 0.76rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2.25rem, 7vw, 4rem);
        line-height: 1.05;
        letter-spacing: -0.035em;
      }

      .subtitle {
        margin: 20px 0 30px;
        color: #596273;
        font-size: clamp(1rem, 2.5vw, 1.14rem);
        line-height: 1.7;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 0 18px;
        border: 1px solid #cfd6e1;
        border-radius: 999px;
        color: #27354d;
        font-weight: 650;
        text-decoration: none;
        transition: transform 150ms ease, border-color 150ms ease;
      }

      a:hover { transform: translateY(-1px); border-color: #7e8ca3; }

      .primary {
        border-color: #27354d;
        color: #fff;
        background: #27354d;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Research project</p>
      <h1>SAFE-Pruner</h1>
      <p class="subtitle">
        Semantic Attention-Guided Future-Aware Token Pruning for Efficient
        Vision-Language-Action Manipulation.
      </p>
      <div class="actions">
        <a class="primary" href="./SAFE-Pruner/">View project page</a>
        <a href="https://github.com/msssl/SAFE-Pruner">Code</a>
      </div>
    </main>
  </body>
</html>
